[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "textbee"
dynamic = ["version"]
description = "Official Python SDK for textbee.dev, the open source SMS gateway"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "textbee.dev", email = "support@textbee.dev" }]
keywords = [
  "sms",
  "sms-gateway",
  "textbee",
  "android",
  "sms-segments",
  "gsm-7",
  "e164",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Telephony",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://textbee.dev"
Documentation = "https://textbee.dev/docs"
Repository = "https://github.com/textbee/textbee-python"
Issues = "https://github.com/textbee/textbee-python/issues"
Changelog = "https://github.com/textbee/textbee-python/releases"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.version]
path = "src/textbee/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# TypedDict annotations get evaluated by typing.get_type_hints, and `X | None`
# fails to evaluate on Python 3.9.
"src/textbee/_types.py" = ["UP006", "UP007", "UP035", "UP045"]
